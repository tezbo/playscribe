# Fly.io app for the Playscribe API. One small machine with a 1 GB volume for SQLite.
# Secrets are set with `fly secrets set` (see backend/README.md), never in this file.
app = "playscribe-api"
primary_region = "lhr"

[build]

[env]
  DATABASE_PATH = "/data/playscribe.db"
  INGEST_INTERVAL_MINUTES = "60"
  APNS_TOPIC = "co.codeconnectors.playscribe"

[mounts]
  source = "playscribe_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The scheduler lives in the process, so the machine stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
