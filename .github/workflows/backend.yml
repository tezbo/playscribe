name: Backend

on:
  pull_request:
    paths: ['backend/**', 'docs/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    # Deploys main to Fly.io once FLY_API_TOKEN is set as a repository secret.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-backend
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Fly token
        id: fly
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::FLY_API_TOKEN not set; skipping deploy"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.ready == 'true'
      - name: Deploy
        if: steps.fly.outputs.ready == 'true'
        run: flyctl deploy --remote-only
      - name: Smoke test
        if: steps.fly.outputs.ready == 'true'
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://playscribe-api.fly.dev/v1/health
