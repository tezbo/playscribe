name: Signing check

# Archives and exports Release with the widget through the API key, checks the bundle ids, app group and
# provisioning profiles in the .ipa, and uploads NOTHING. Tells us in minutes whether automatic signing
# creates the widget App ID and the App Group.
on:
  workflow_dispatch:
    inputs:
      version: {description: "Marketing version to sign as", default: "0.5.0", required: false}

concurrency: testflight

jobs:
  check:
    # Xcode 27.1 is only on GitHub's xcode-27 image (see ios.yml).
    runs-on: xcode-27
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_SCHEME: ${{ vars.IOS_SCHEME }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate the project (XcodeGen)
        if: hashFiles('ios/project.yml') != ''
        run: brew install xcodegen && (cd ios && xcodegen generate)
      - name: Check prerequisites
        id: ready
        run: |
          if ! ls -d ios/*.xcodeproj >/dev/null 2>&1; then echo "::notice::No Xcode project yet"; exit 0; fi
          for v in ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::warning::$v is not set; see ios/fastlane/README.md"; exit 0; fi
          done
          if [ -z "$ASC_KEY_P8$ASC_KEY_P8_BASE64" ]; then echo "::warning::ASC_KEY_P8 is not set; see ios/fastlane/README.md"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Select Xcode 27.1
        if: steps.ready.outputs.ok
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - uses: ruby/setup-ruby@v1
        if: steps.ready.outputs.ok
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - name: Check the lanes' fastlane API use
        if: steps.ready.outputs.ok
        working-directory: ios
        run: bundle exec ruby fastlane/check_api.rb
      - name: Archive, export and check the signing
        if: steps.ready.outputs.ok
        working-directory: ios
        env:
          VERSION: ${{ inputs.version }}
        run: bundle exec fastlane signing_check marketing_version:"$VERSION"
