name: Feed

# The zero-cost backend: every hour, poll the sources and publish the static feed to the `feed`
# branch, served at https://raw.githubusercontent.com/tezbo/playscribe/feed/v1/index.json.
# The SQLite state travels with it (state/playscribe.db). The branch holds one commit, replaced on
# every run, so it never grows. Free on a public repository.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'poll, backfill (read history back to the since date), confirm (a person checked an official post naming PS5), dismiss (a review item) or info (refresh every game''s description and trailers now)'
        type: choice
        options: [poll, backfill, confirm, dismiss, info]
        default: poll
      release:
        description: 'confirm: release id, e.g. dawnwalker@1.1'
        required: false
      source:
        description: 'confirm: the official source id you checked, e.g. dawnwalker-news'
        required: false
      version:
        description: 'confirm: PS5 version as the console shows it, e.g. 01.004.000 (optional)'
        required: false
      size_bytes:
        description: 'confirm: download size in bytes (optional)'
        required: false
      status:
        description: 'confirm: live (default), announced or notPlanned'
        required: false
      review_item:
        description: 'dismiss: review item id from review.json'
        required: false
      since:
        description: 'backfill: earliest date to read, e.g. 2024-01-01'
        required: false
        default: '2024-01-01'

concurrency: feed

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    # The Twitch keys for IGDB (covers, PS5 dates and their precision) live in this environment.
    environment: development
    # A backfill reads the press list at its 5 s Crawl-delay, so it runs much longer than a poll.
    timeout-minutes: ${{ inputs.action == 'backfill' && 180 || 20 }}
    env:
      DATABASE_PATH: ${{ github.workspace }}/out/state/playscribe.db
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      # Push is parked until the Apple Developer Program is paid for; set PUSH_ENABLED=1 as a
      # repository variable and add the APNS_* secrets to turn it on.
      PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current feed and state
        run: |
          mkdir -p out
          if git fetch --depth 1 origin feed; then git --work-tree=out checkout FETCH_HEAD -- . && git reset -q; else echo "No feed branch yet; starting fresh"; fi
          ls -la out out/state 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Poll
        if: github.event_name == 'schedule' || inputs.action == 'poll'
        working-directory: backend
        run: npm run ingest --silent -- --export "$GITHUB_WORKSPACE/out"
      - name: Backfill
        if: inputs.action == 'backfill'
        working-directory: backend
        env:
          SINCE: ${{ inputs.since }}
        run: npm run ingest --silent -- --backfill "$SINCE" --export "$GITHUB_WORKSPACE/out"
      - name: Confirm
        if: inputs.action == 'confirm'
        working-directory: backend
        env:
          RELEASE: ${{ inputs.release }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          SIZE: ${{ inputs.size_bytes }}
          STATUS: ${{ inputs.status }}
        run: |
          set -- "$RELEASE" --source "$SOURCE" --export "$GITHUB_WORKSPACE/out"
          [ -n "$VERSION" ] && set -- "$@" --version "$VERSION"
          [ -n "$SIZE" ] && set -- "$@" --size-bytes "$SIZE"
          [ -n "$STATUS" ] && set -- "$@" --status "$STATUS"
          npm run confirm --silent -- "$@"
      - name: Dismiss
        if: inputs.action == 'dismiss'
        working-directory: backend
        env:
          ITEM: ${{ inputs.review_item }}
        run: npm run confirm --silent -- --dismiss "$ITEM" --export "$GITHUB_WORKSPACE/out"
      # Every game's description, genres, first release and trailers (v1/info), so no game page is
      # ever blank. Refreshed weekly, or now with the info action.
      - name: Game info
        if: github.event_name == 'schedule' || inputs.action == 'poll' || inputs.action == 'info'
        working-directory: backend
        run: |
          stamp="$GITHUB_WORKSPACE/out/v1/info/fetched-at"
          if [ "${{ inputs.action }}" != info ] && [ -f "$stamp" ] && [ $(( $(date +%s) - $(date -d "$(cat "$stamp")" +%s) )) -lt 604800 ]; then echo "Info is fresh"; exit 0; fi
          npm run game-info --silent -- "$GITHUB_WORKSPACE/out" && date -u +%FT%TZ > "$stamp"
      - name: Publish
        working-directory: out
        run: |
          sqlite_wal="state/playscribe.db-wal"; [ -f "$sqlite_wal" ] && echo "WAL left behind" && exit 1
          rm -f state/*.db-shm
          cat > README.md <<'MD'
          Generated by .github/workflows/feed.yml on main. Do not edit; every run replaces this branch.
          MD
          git init -q -b feed
          git add -A
          git -c user.name="playscribe-feed[bot]" -c user.email="feed@users.noreply.github.com" commit -q -m "Feed $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
          echo "Published $(find v1 -name '*.json' | wc -l) files"
