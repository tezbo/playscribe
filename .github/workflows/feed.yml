name: Feed

# The zero-cost backend: every hour, poll the sources and publish the static feed to the `feed`
# branch, served at https://raw.githubusercontent.com/tezbo/playscribe/feed/v1/index.json.
# The SQLite state travels with it (state/playscribe.db.gz, gzipped since 12 Nov 2026 because the raw file passed GitHub's 100 MB limit). The branch holds one commit, replaced on
# every run, so it never grows. Free on a public repository.
# GitHub's schedule fires late or skips for hours when its queue is busy (11 Nov 2026: one full poll in 4.5 h), so the relay
# Worker's cron (relay/worker.js, :22 and :52) starts this workflow by workflow_dispatch whenever no run began in the last
# 10 minutes; `hot: true` is its :52 run. Decision: docs/decisions/feed-cron-worker.md.
# At :47 a short hot run polls only the hot set (backend/src/hot.ts: games with a patch in the last 14
# days plus backend/src/sources/hot-pinned.json), so followed games get faster alerts. About 1 to 2
# minutes a run, so roughly 1,000 to 1,500 extra Actions minutes a month, free on a public repository.
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'poll, backfill (read history back to the since date), confirm (a person checked an official post naming PS5), dismiss (a review item) or info (refresh every game''s description and trailers now)'
        type: choice
        options: [poll, backfill, confirm, dismiss, info]
        default: poll
      hot:
        description: 'poll: hot set only (the :47 run), as the relay Worker cron sends it'
        type: boolean
        default: false
      release:
        description: 'confirm: release id, e.g. dawnwalker@1.1'
        required: false
      source:
        description: 'confirm: the official source id you checked, e.g. dawnwalker-news'
        required: false
      version:
        description: 'confirm: PS5 version as the console shows it, e.g. 01.004.000 (optional)'
        required: false
      size_bytes:
        description: 'confirm: download size in bytes (optional)'
        required: false
      status:
        description: 'confirm: live (default), announced or notPlanned'
        required: false
      review_item:
        description: 'dismiss: review item id from review.json'
        required: false
      since:
        description: 'backfill: earliest date to read, e.g. 2024-01-01'
        required: false
        default: '2024-01-01'

concurrency: feed

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    # The Twitch keys for IGDB (covers, PS5 dates and their precision) live in this environment.
    environment: development
    # A backfill reads the press list at its 5 s Crawl-delay, so it runs much longer than a poll.
    timeout-minutes: ${{ inputs.action == 'backfill' && 180 || 20 }}
    env:
      DATABASE_PATH: ${{ github.workspace }}/out/state/playscribe.db
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      # Push is parked until the Apple Developer Program is paid for; set PUSH_ENABLED=1 as a
      # repository variable and add the APNS_* secrets to turn it on.
      PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      # The App Store Connect / TestFlight bundle id (the release lane overrides project.yml's), which APNs needs as the topic.
      APNS_TOPIC: tezbo.Playscribe
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current feed and state
        run: |
          mkdir -p out
          if git fetch --depth 1 origin feed; then git --work-tree=out checkout FETCH_HEAD -- . && git reset -q; else echo "No feed branch yet; starting fresh"; fi
          # The state database is published gzipped (state/playscribe.db.gz): the raw file passed GitHub's 100 MB limit on 12 Nov 2026.
          # An older branch still holds the raw file; either is read.
          if [ -f out/state/playscribe.db.gz ]; then gunzip -f out/state/playscribe.db.gz; fi
          ls -la out out/state 2>/dev/null || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Push: load the devices the relay holds for the length of this run. They are scrubbed again before Publish.
      # Never fatal: if the relay is down, not deployed yet, or the Cloudflare token changed, the poll and the publish still
      # run and push is DEFERRED (no release is claimed as pushed), so the alert goes out on the next run that loads.
      - name: Load devices from the relay
        id: load
        if: vars.PUSH_ENABLED == '1'
        continue-on-error: true
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -s "$GITHUB_WORKSPACE/relay/url.txt" ] || { echo "relay/url.txt is missing: the relay is not deployed yet"; exit 1; }
          export RELAY_URL="$(cat "$GITHUB_WORKSPACE/relay/url.txt")"
          export RELAY_ADMIN_TOKEN="$(printf 'relay-admin:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$RELAY_ADMIN_TOKEN"
          npx tsx scripts/relay-sync.ts "$RUNNER_TEMP/relay-tokens"
      - name: Defer push when the relay did not load
        if: vars.PUSH_ENABLED == '1' && steps.load.outcome != 'success'
        run: |
          echo "PUSH_DEFER=1" >> "$GITHUB_ENV"
          echo "::warning::Push skipped this run: the relay devices did not load. Releases stay unclaimed and are pushed on the next run that loads."
      # Auto-onboarding (0.5.4): what the derived registry would follow, from the published info shards. Prints only.
      - name: Auto-onboarding dry run
        if: (github.event_name == 'schedule' && github.event.schedule != '47 * * * *') || (inputs.action == 'poll' && !inputs.hot)
        working-directory: backend
        run: npx tsx scripts/auto-registry.ts --info "$GITHUB_WORKSPACE/out/v1/info" --sample 20
      - name: Poll
        if: github.event_name == 'schedule' || inputs.action == 'poll'
        working-directory: backend
        env:
          HOT_RUN: ${{ (github.event.schedule == '47 * * * *' || inputs.hot) && '--hot' || '' }}
          # Auto-onboarding: games polled per full run from the derived registry. Unset or 0 = off (dry run only).
          # Set the AUTO_SLICE repository variable (600 = a full cycle in about 9 runs) to turn it on.
          AUTO_SLICE: ${{ vars.AUTO_SLICE }}
          # Alerts are claimed here but sent after Publish (scripts/push-send.ts): a run that fails to publish loses its claim with the
          # rest of the run and never alerts for a release the feed does not hold (12 Nov: Rogue Prince pushed 3 times, never published).
          PUSH_QUEUE: ${{ runner.temp }}/push-queue.json
        run: npm run ingest --silent -- $HOT_RUN --export "$GITHUB_WORKSPACE/out"
      - name: Backfill
        if: inputs.action == 'backfill'
        working-directory: backend
        env:
          SINCE: ${{ inputs.since }}
        run: npm run ingest --silent -- --backfill "$SINCE" --export "$GITHUB_WORKSPACE/out"
      - name: Confirm
        if: inputs.action == 'confirm'
        working-directory: backend
        env:
          RELEASE: ${{ inputs.release }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          SIZE: ${{ inputs.size_bytes }}
          STATUS: ${{ inputs.status }}
        run: |
          set -- "$RELEASE" --source "$SOURCE" --export "$GITHUB_WORKSPACE/out"
          [ -n "$VERSION" ] && set -- "$@" --version "$VERSION"
          [ -n "$SIZE" ] && set -- "$@" --size-bytes "$SIZE"
          [ -n "$STATUS" ] && set -- "$@" --status "$STATUS"
          npm run confirm --silent -- "$@"
      - name: Dismiss
        if: inputs.action == 'dismiss'
        working-directory: backend
        env:
          ITEM: ${{ inputs.review_item }}
        run: npm run confirm --silent -- --dismiss "$ITEM" --export "$GITHUB_WORKSPACE/out"
      # Every game's description, genres, first release and trailers (v1/info), so no game page is
      # ever blank. Refreshed weekly, or now with the info action.
      - name: Game info
        if: (github.event_name == 'schedule' && github.event.schedule != '47 * * * *') || (inputs.action == 'poll' && !inputs.hot) || inputs.action == 'info'
        working-directory: backend
        run: |
          stamp="$GITHUB_WORKSPACE/out/v1/info/fetched-at"
          if [ "${{ inputs.action }}" != info ] && [ -f "$stamp" ] && [ $(( $(date +%s) - $(date -d "$(cat "$stamp")" +%s) )) -lt 604800 ]; then echo "Info is fresh"; exit 0; fi
          npm run game-info --silent -- "$GITHUB_WORKSPACE/out" && date -u +%FT%TZ > "$stamp"
      # Upcoming PS5 games for the watchlist (v1/upcoming), refreshed daily, or now with the info action.
      - name: Upcoming games
        if: (github.event_name == 'schedule' && github.event.schedule != '47 * * * *') || (inputs.action == 'poll' && !inputs.hot) || inputs.action == 'info'
        working-directory: backend
        run: |
          stamp="$GITHUB_WORKSPACE/out/v1/upcoming/fetched-at"
          if [ "${{ inputs.action }}" != info ] && [ -f "$stamp" ] && [ $(( $(date +%s) - $(date -d "$(cat "$stamp")" +%s) )) -lt 82800 ]; then echo "Upcoming is fresh"; exit 0; fi
          npm run upcoming --silent -- "$GITHUB_WORKSPACE/out" && date -u +%FT%TZ > "$stamp"
      # Always runs, and Publish does not run if it fails: the state database goes to a public branch, so it must hold
      # no device and no APNs token. Counts only in the log.
      - name: Scrub devices
        if: always()
        working-directory: backend
        run: npx tsx scripts/relay-scrub.ts "$RUNNER_TEMP/relay-tokens"
      - name: Publish
        id: publish
        working-directory: out
        run: |
          sqlite_wal="state/playscribe.db-wal"; [ -f "$sqlite_wal" ] && echo "WAL left behind" && exit 1
          rm -f state/*.db-shm
          # GitHub rejects a file over 100 MB, and the database was 110 MB on 12 Nov 2026: publish it gzipped (about a fifth of the size).
          gzip -9 -f state/playscribe.db
          ls -la state
          # Size guard: warn at 80 MB compressed, fail (after publishing, so the feed stays current) at 90 MB. GitHub's hard limit is 100 MB.
          db_bytes=$(stat -c%s state/playscribe.db.gz); db_mb=$((db_bytes / 1000000))
          echo "State database: ${db_mb} MB compressed (warn at 80, fail at 90, GitHub rejects at 100)"
          echo "### State database: ${db_mb} MB compressed (warn 80, fail 90, limit 100)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$db_bytes" -ge 80000000 ]; then echo "::warning title=Feed state database is ${db_mb} MB::Compressed state is over 80 MB; GitHub rejects 100 MB and the feed would stop. See docs/ps5-patch-data.md (state size)."; fi
          cat > README.md <<'MD'
          Generated by .github/workflows/feed.yml on main. Do not edit; every run replaces this branch.
          MD
          git init -q -b feed
          git add -A
          git -c user.name="playscribe-feed[bot]" -c user.email="feed@users.noreply.github.com" commit -q -m "Feed $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed
          echo "Published $(find v1 -name '*.json' | wc -l) files"
          echo "published=1" >> "$GITHUB_OUTPUT"
          if [ "$db_bytes" -ge 90000000 ]; then echo "::error title=Feed state database is ${db_mb} MB::Compressed state reached 90 MB (limit 100). Published this run; the next growth may stop the feed. Prune or move state now."; exit 1; fi
      # Alerts go out only now, once the feed branch holds the release and its pushed claim. Runs even when the size guard above failed after
      # publishing. r071: tokens that come back dead are reported to the relay (ids and token hashes only). Never fatal: a failure here loses
      # this run's alerts at most and cannot repeat one.
      - name: Send pushes
        if: always() && steps.publish.outputs.published == '1' && vars.PUSH_ENABLED == '1' && steps.load.outcome == 'success'
        continue-on-error: true
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export RELAY_URL="$(cat "$GITHUB_WORKSPACE/relay/url.txt")"
          export RELAY_ADMIN_TOKEN="$(printf 'relay-admin:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$RELAY_ADMIN_TOKEN"
          npx tsx scripts/push-send.ts "$RUNNER_TEMP/push-queue.json"
