name: site
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The universal-link association file carries the Apple Team ID, which lives in the
      # APPLE_TEAM_ID secret (not the repo). Without it, publish no file rather than a broken one.
      - name: Fill in the Apple Team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          f=site/.well-known/apple-app-site-association
          if [ -n "$APPLE_TEAM_ID" ]; then
            sed -i "s/TEAMID\./${APPLE_TEAM_ID}./" "$f"
          else
            echo "::warning::APPLE_TEAM_ID is not set: universal links are off until it is."
            rm "$f"
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
