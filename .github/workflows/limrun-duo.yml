name: Limrun Duo (interactive/video/parity)

# Real iPhone Duo on Limrun's cloud, for what the free sim-use CI shoot cannot do (video, release parity).
# Manual only, costs credits (~2 per simulator minute). Needs the repo Actions secret LIMRUN_API_KEY; without it the
# job fails (Quinn, beta 6 gate: a skipped shoot must never read as a pass) and spends nothing.
on:
  workflow_dispatch:
    inputs:
      route: { description: 'QA route to open (-qaRoute), e.g. gamepage/dawnwalker', default: 'library/playing' }
      steps: { description: 'angle[:orientation] list', default: '0 180 90:landscape-left' }
      record: { description: 'Record video (1 = yes)', default: '' }

jobs:
  duo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIM_API_KEY: ${{ secrets.LIMRUN_API_KEY }}
    steps:
      - name: Check the secret
        id: gate
        run: |
          if [ -z "$LIM_API_KEY" ]; then
            echo "::error::LIMRUN_API_KEY is not set (repo Settings > Secrets and variables > Actions). Nothing was shot; no credits spent."
            echo "### Failed: LIMRUN_API_KEY secret missing, nothing was shot" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Shoot
        env:
          RECORD: ${{ inputs.record }}
          STEPS: ${{ inputs.steps }}
          ROUTE: ${{ inputs.route }}
        run: ios/tools/qa/limrun-duo.sh out "$ROUTE" "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: limrun-duo, path: out }
