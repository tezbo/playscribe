name: Limrun Duo (interactive/video/parity)

# Real iPhone Duo on Limrun's cloud, for what the free sim-use CI shoot cannot do (video, release parity).
# Manual only, costs credits (~2 per simulator minute). Needs the repo Actions secret LIMRUN_API_KEY;
# until it exists this workflow exits green with a notice and spends nothing.
on:
  workflow_dispatch:
    inputs:
      steps: { description: 'angle[:orientation] list', default: '0 180 90:landscape-left' }
      record: { description: 'Record video (1 = yes)', default: '' }

jobs:
  duo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIM_API_KEY: ${{ secrets.LIMRUN_API_KEY }}
    steps:
      - name: Check the secret
        id: gate
        run: |
          if [ -z "$LIM_API_KEY" ]; then
            echo "::notice::LIMRUN_API_KEY is not set (repo Settings > Secrets and variables > Actions). Skipping; no credits spent."
            echo "### Skipped: LIMRUN_API_KEY secret missing" >> "$GITHUB_STEP_SUMMARY"
            echo "run=no" >> "$GITHUB_OUTPUT"
          else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
      - name: Shoot
        if: steps.gate.outputs.run == 'yes'
        env:
          RECORD: ${{ inputs.record }}
          STEPS: ${{ inputs.steps }}
        run: ios/tools/qa/limrun-duo.sh out library/playing "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'yes'
        with: { name: limrun-duo, path: out }
