name: TestFlight

# Only a release tag like v0.2.0 ships to TestFlight, after Terry's go (see docs/release.md).
on:
  push:
    tags: ['v*.*.*']

concurrency: testflight

jobs:
  beta:
    # Xcode 27.1 is only on GitHub's xcode-27 image (see ios.yml).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_SCHEME: ${{ vars.IOS_SCHEME }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate the project (XcodeGen)
        if: hashFiles('ios/project.yml') != ''
        run: command -v xcodegen >/dev/null || brew install xcodegen; (cd ios && xcodegen generate)
      - name: Check prerequisites
        id: ready
        run: |
          if ! ls -d ios/*.xcodeproj >/dev/null 2>&1; then echo "::notice::No Xcode project yet"; exit 0; fi
          for v in ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::warning::$v is not set; see ios/fastlane/README.md"; exit 0; fi
          done
          if [ -z "$ASC_KEY_P8$ASC_KEY_P8_BASE64" ]; then echo "::warning::ASC_KEY_P8 is not set; see ios/fastlane/README.md"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Select Xcode 27.1
        if: steps.ready.outputs.ok
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - uses: ruby/setup-ruby@v1
        if: steps.ready.outputs.ok
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios
      - name: Check the lanes' fastlane API use
        if: steps.ready.outputs.ok
        working-directory: ios
        run: bundle exec ruby fastlane/check_api.rb
      - name: Keep the account under the certificate cap
        if: steps.ready.outputs.ok
        continue-on-error: true
        run: |
          python3 -m venv /tmp/certvenv
          /tmp/certvenv/bin/pip install -q pyjwt cryptography requests
          /tmp/certvenv/bin/python ios/tools/prune_certs.py
      - name: Build and upload
        if: steps.ready.outputs.ok
        working-directory: ios
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle exec fastlane beta marketing_version:"$version"
