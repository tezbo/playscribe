name: TestFlight feedback

# Turns TestFlight beta feedback (screenshots and crashes) into labelled GitHub issues. Free: a script on a
# Linux runner with the existing App Store Connect key. Public repo: issues carry no tester email (see
# ios/tools/asc_feedback.py). Runs every 5 minutes and stays quiet when nothing is new. Missing secrets and network
# errors are warnings. The run goes red only when App Store Connect refuses the key (401 or 403), so a dead key shows.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run: {description: "Count new items without creating issues", type: boolean, default: true}
      min_build: {description: "Oldest build number to include", default: "8"}
      crash_id: {description: "Fetch this crash submission's log, encrypted (asc_crashlog.py)", default: ""}
      crash_pubkey: {description: "Requester's RSA public key (PEM) for the crash log", default: ""}

concurrency: testflight-feedback

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      MIN_BUILD: ${{ inputs.min_build || '8' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - if: ${{ !inputs.crash_id }}
        run: python3 ios/tools/asc_feedback.py
      # One crash log, encrypted to the requester's key: the log text never reaches the job log or the repo.
      - if: ${{ inputs.crash_id }}
        env:
          CRASH_ID: ${{ inputs.crash_id }}
          CRASH_PUBKEY: ${{ inputs.crash_pubkey }}
        run: python3 ios/tools/asc_crashlog.py
      - if: ${{ inputs.crash_id }}
        uses: actions/upload-artifact@v4
        with: {name: crashlog-encrypted, path: "crashlog.*", retention-days: 1}
