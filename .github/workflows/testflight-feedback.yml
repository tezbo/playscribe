name: TestFlight feedback

# Turns TestFlight beta feedback (screenshots and crashes) into labelled GitHub issues. Free: a script on a
# Linux runner with the existing App Store Connect key. Public repo: issues carry no tester email (see
# ios/tools/asc_feedback.py). Runs every 5 minutes and stays quiet when nothing is new. Missing secrets or API errors are warnings, so a bad day never emails anyone.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run: {description: "Count new items without creating issues", type: boolean, default: true}
      min_build: {description: "Oldest build number to include", default: "8"}

concurrency: testflight-feedback

permissions:
  contents: read
  issues: write

jobs:
  feedback:
    runs-on: ubuntu-latest
    continue-on-error: true  # a red setup step would email Terry; the script itself always exits 0
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      MIN_BUILD: ${{ inputs.min_build || '8' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - run: python3 ios/tools/asc_feedback.py
