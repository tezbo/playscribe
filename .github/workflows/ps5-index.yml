name: PS5 index

# Rebuilds the app's bundled PS5 catalogue from IGDB and pushes it to the ps5-index-update branch
# for review. Needs TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET in the "development" environment.
on:
  workflow_dispatch:
    inputs:
      inspect:
        description: 'Optional IGDB ids to print PS5 release rows for, e.g. 1020,17269'
        required: false
        default: '1020,17269'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The Twitch keys live in the repository's "development" environment.
    environment: development
    timeout-minutes: 20
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Check secrets
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$TWITCH_CLIENT_SECRET" ]; then echo "::error::Set TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET in the development environment"; exit 1; fi
      - name: Inspect
        if: inputs.inspect
        working-directory: backend
        run: npm run ps5-index --silent -- --inspect "${{ inputs.inspect }}"
      - name: Rebuild
        working-directory: backend
        run: npm run ps5-index --silent
      - name: Push for review
        run: |
          git diff --quiet && { echo "No change"; exit 0; }
          git switch -c ps5-index-update
          git -c user.name="playscribe-bot" -c user.email="bot@users.noreply.github.com" commit -qam "Rebuild PS5 index from IGDB"
          git push -f origin ps5-index-update
          echo "::notice::Pushed ps5-index-update; open a PR from it"
