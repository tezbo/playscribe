name: iOS

on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The app targets iOS 27.1 (the Duo APIs need it). macos-latest only has Xcode 26, so this uses
    # GitHub's free Xcode 27 image (public preview, label xcode-27) and pins the stable 27.1.
    runs-on: xcode-27
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
    steps:
      - uses: actions/checkout@v4
      - name: Generate the project (XcodeGen)
        if: hashFiles('ios/project.yml') != ''
        run: brew install xcodegen && (cd ios && xcodegen generate)
      - name: Find the Xcode project
        id: project
        run: |
          proj=$(ls -d ios/*.xcodeproj 2>/dev/null | head -1 || true)
          if [ -z "$proj" ]; then echo "::notice::No Xcode project in ios/ yet; nothing to build"; exit 0; fi
          echo "path=$proj" >> "$GITHUB_OUTPUT"
      - name: Select Xcode 27.1
        if: steps.project.outputs.path
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - name: Pick an iOS 27.1 simulator
        if: steps.project.outputs.path
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          runtimes = [k for k in d if 'iOS-27-1' in k]
          phones = [x for k in runtimes for x in d[k] if 'iPhone' in x['name']]
          # Prefer the Duo when the runtime has one.
          phones.sort(key=lambda x: 'Duo' not in x['name'])
          print(phones[0]['udid'] + ' ' + phones[0]['name'] if phones else '')
          ")
          if [ -z "$udid" ]; then echo "::error::No iOS 27.1 iPhone simulator on this runner"; xcrun simctl list runtimes; exit 1; fi
          echo "Using ${udid#* }"
          echo "udid=${udid%% *}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        if: steps.project.outputs.path
        run: |
          status=0
          xcodebuild test \
            -project "${{ steps.project.outputs.path }}" \
            -scheme "${SCHEME:-Playscribe}" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E 'error:|\*\* (BUILD|TEST)|Test Suite .* (passed|failed)|Executed' build.log || true
          echo "xcodebuild exited with $status"
          exit "$status"
        env:
          SCHEME: ${{ vars.IOS_SCHEME }}
      - uses: actions/upload-artifact@v4
        if: failure() && steps.project.outputs.path
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build.log
