name: Delete a leftover branch

# Manual only. This removes a manual step (agents' git pushes cannot delete remote branches: the proxy returns 403);
# it does NOT replace Terry's approval. Deleting a branch still needs Terry's plain yes every time, quoted by whoever
# runs this. Guards: only claude/* branches, never the default branch, the tip must equal expected_sha (so you delete
# exactly what was reviewed), and a branch with an open PR is refused.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to delete, must start with claude/'
        required: true
      expected_sha:
        description: 'Full 40-character tip SHA you verified; the delete is refused if the tip differs'
        required: true
      approval:
        description: "Where Terry said yes (message id or quote); required"
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete the branch if every guard holds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          EXPECTED: ${{ inputs.expected_sha }}
          APPROVAL: ${{ inputs.approval }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$BRANCH" in claude/*) ;; *) echo "refused: only claude/* branches"; exit 1;; esac
          [ "$BRANCH" != "$DEFAULT" ] || { echo "refused: default branch"; exit 1; }
          [ -n "$APPROVAL" ] || { echo "refused: no approval reference"; exit 1; }
          case "$EXPECTED" in *[!0-9a-f]*|"") echo "refused: expected_sha must be 40 hex characters"; exit 1;; esac
          [ "${#EXPECTED}" -eq 40 ] || { echo "refused: expected_sha must be 40 hex characters"; exit 1; }
          tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)
          [ "$tip" = "$EXPECTED" ] || { echo "refused: tip is $tip, not $EXPECTED"; exit 1; }
          open=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq length)
          [ "$open" = "0" ] || { echo "refused: $open open PR(s) on this branch"; exit 1; }
          echo "Deleting $BRANCH at $tip. Approval: $APPROVAL"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "Deleted. Restore with: git push origin $tip:refs/heads/$BRANCH"
