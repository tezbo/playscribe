name: Sim boot probe

# Card qa-ci-sim-boot-time: screen-diffs.yml waits 4.9 min for the simulator to boot (run 43326265090). This probe times
# where that goes on the free xcode-27 runner: first and second boot of the iPhone Duo and of a plain iPhone, bootstatus
# stages, and a boot that overlaps a generic build. Measurement only; runs when this file changes on a claude/** branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/sim-boot-probe.yml']

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$XCODE_APP" && xcodebuild -version && sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string && sw_vers
      - name: Devices
        id: dev
        run: |
          xcrun simctl list devices available | grep -A30 "iOS 27.1" | head -30
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          xs = [x for k in d if 'iOS-27-1' in k for x in d[k] if sys.argv[1](x['name']) if False] if False else None
          " ; }
          duo=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          xs = [x for k in d if 'iOS-27-1' in k for x in d[k] if 'Duo' in x['name']]
          print(xs[0]['udid'] if xs else '')")
          plain=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          xs = [x for k in d if 'iOS-27-1' in k for x in d[k] if x['name'].startswith('iPhone') and 'Duo' not in x['name'] and 'Pro' not in x['name']]
          print(xs[0]['udid'] if xs else '')")
          echo "duo=$duo" >> "$GITHUB_OUTPUT"; echo "plain=$plain" >> "$GITHUB_OUTPUT"
          echo "duo $duo plain $plain"
      - name: Boot timings
        run: |
          probe() {
            local name=$1 udid=$2 t
            [ -n "$udid" ] || { echo "$name: no device"; return; }
            t=$SECONDS; xcrun simctl boot "$udid" 2>&1 | tail -1; echo "$name boot command $(( SECONDS - t )) s"
            t=$SECONDS; xcrun simctl bootstatus "$udid" 2>&1 | tail -8; echo "$name bootstatus $(( SECONDS - t )) s"
            t=$SECONDS; xcrun simctl spawn "$udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true; echo "$name defaults write $(( SECONDS - t )) s"
            t=$SECONDS; xcrun simctl shutdown "$udid"; echo "$name shutdown $(( SECONDS - t )) s"
            t=$SECONDS; xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" >/dev/null 2>&1; echo "$name second boot $(( SECONDS - t )) s"
            xcrun simctl shutdown "$udid"
          }
          probe duo "${{ steps.dev.outputs.duo }}"
          probe plain "${{ steps.dev.outputs.plain }}"
          # A brand-new device: what a never-booted simulator costs.
          rt=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; print([r['identifier'] for r in json.load(sys.stdin)['runtimes'] if '27-1' in r['identifier']][0])")
          dt=$(xcrun simctl list devices -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['deviceTypeIdentifier'] for k in d for x in d[k] if x['udid']=='${{ steps.dev.outputs.duo }}'][0])")
          new=$(xcrun simctl create probe-duo "$dt" "$rt"); probe fresh-duo "$new"
      - name: Boot overlapping a generic build
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen; (cd ios && xcodegen generate)
          udid=${{ steps.dev.outputs.duo }}
          t0=$SECONDS
          (xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" >/dev/null 2>&1; echo "overlap: boot done at $(( SECONDS - t0 )) s") &
          xcodebuild build-for-testing -project ios/Playscribe.xcodeproj -scheme Playscribe \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || tail -5 build.log
          echo "overlap: build done at $(( SECONDS - t0 )) s"
          wait
          echo "overlap: both done at $(( SECONDS - t0 )) s"
