name: Duo poses (real hinge)

# Cloud-native Duo QA (24 Nov 2026). Real fold on the hosted xcode-27 runner via sim-use (vendor HID reports
# to dtuhidd, no Device Hub). Installs the app, launches a route, folds through the hinge angles, and keeps
# native screenshots of each display, the display topology and the accessibility outline per step.
# Evidence only; not a required check. Inputs: route (-qaRoute value).
on:
  workflow_dispatch:
    inputs:
      route: { description: 'qaRoute to launch', default: 'gamepage/dawnwalker' }
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/duo-poses.yml']

jobs:
  poses:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ROUTE: ${{ inputs.route || 'gamepage/dawnwalker' }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app && brew install xcodegen && (cd ios && xcodegen generate)
      - name: Install sim-use
        run: |
          brew tap lycorp-jp/tap
          brew trust lycorp-jp/tap || true
          brew install lycorp-jp/tap/sim-use
      - name: Boot the Duo and build the app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          print(next(x['udid'] for k in d if 'iOS-27-1' in k for x in d[k] if 'Duo' in x['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcodebuild build -project ios/Playscribe.xcodeproj -scheme Playscribe -destination "id=$UDID" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep error: build.log | head; exit 1; }
          xcrun simctl install "$UDID" "$(ls -d build/dd/Build/Products/Debug-iphonesimulator/Playscribe.app)"
      - name: Fold through the poses
        run: |
          mkdir -p out; exec > >(tee out/poses.log) 2>&1
          B=co.codeconnectors.playscribe
          snap() { # name display(1 outer, 3 inner)
            xcrun simctl io "$UDID" screenshot --display=$2 "out/$1.png" 2>&1 | tail -1
            sim-use ui --device "$UDID" > "out/$1.ui.txt" 2>&1 || true
            xcrun devicectl device info displays --device "$UDID" 2>&1 | grep -E 'LCD|active|currentOrientation' > "out/$1.displays.txt" || true; }
          xcrun simctl launch "$UDID" $B -qaRoute "$ROUTE" -qaForceDark NO; sleep 8
          snap 01-closed-outer 1
          for a in 180 130 90 60; do
            echo "=== fold $a"; sim-use ios fold $a --json --device "$UDID" 2>&1 | cut -c1-260; sleep 5; snap 02-fold$a-inner 3
          done
          echo "=== open landscape/portrait"; sim-use ios fold 180 --device "$UDID" | cut -c1-200; sim-use ios rotate portrait --json --device "$UDID" 2>&1 | cut -c1-260; sleep 4; snap 03-open-portrait-inner 3
          echo "=== fold closed (state continuity)"; sim-use ios fold closed --json --device "$UDID" 2>&1 | cut -c1-260; sleep 5; snap 04-closed-again-outer 1
          sim-use ios rotate landscape-left --json --device "$UDID" 2>&1 | cut -c1-300; sleep 4; snap 05-closed-landscape-outer 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: duo-poses, path: out }
