name: gate-probe
on:
  push:
    branches: [claude/project-thread-sf38dv]
    paths: ['.github/workflows/gate-probe.yml']
jobs:
  probe:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - run: |
          X=/Applications/Xcode_27.1.app
          xcrun simctl help ui 2>&1 | head -30
          xcrun simctl help io 2>&1 | head -30
          echo ---- DeviceHub
          ls $X/Contents/Applications/DeviceHub.app/Contents/MacOS $X/Contents/Applications/DeviceHub.app/Contents/Frameworks 2>&1 | head -30
          strings -a $X/Contents/Applications/DeviceHub.app/Contents/MacOS/DeviceHub | grep -i -E 'partially|setPose|posture|hingeAngle|foldState|devicePose' | sort -u | head -30
          echo ---- CoreSimulator
          for f in $X/Contents/SharedFrameworks/CoreSimulator.framework/CoreSimulator $X/Contents/Developer/Library/PrivateFrameworks/SimulatorKit.framework/SimulatorKit; do echo $f; strings -a $f 2>/dev/null | grep -i -E 'posture|pose|hinge|foldable|duo' | sort -u | head -40; done
          echo ---- simctl
          strings -a $X/Contents/Developer/usr/bin/simctl | grep -i -E 'pose|posture|hinge|fold' | sort -u | head
          echo ---- boot
          xcrun simctl boot D0D80A96-1387-4502-BEFD-3CB0955AD02A && xcrun simctl bootstatus D0D80A96-1387-4502-BEFD-3CB0955AD02A
          xcrun simctl ui D0D80A96-1387-4502-BEFD-3CB0955AD02A 2>&1 | head
          defaults read com.apple.iphonesimulator 2>&1 | head -20
