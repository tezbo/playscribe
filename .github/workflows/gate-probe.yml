name: gate-probe
on:
  push:
    branches: [claude/project-thread-sf38dv]
    paths: ['.github/workflows/gate-probe.yml']
jobs:
  probe:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun simctl help 2>&1 | head -80
          echo ---- Duo devices
          xcrun simctl list devicetypes | grep -i duo
          xcrun simctl list devices available | grep -i duo
          echo ---- help grep
          for c in $(xcrun simctl help 2>&1 | awk '/^\s+[a-z_]+ /{print $1}' | sort -u); do :; done
          xcrun simctl help 2>&1 | grep -i -E 'pose|fold|hinge|display|posture' || echo none
          echo ---- devicectl
          xcrun devicectl --help 2>&1 | head -5
          echo ---- binaries
          ls /Applications/Xcode_27.1.app/Contents/Applications/ 2>&1
          ls /Applications/Xcode_27.1.app/Contents/Developer/usr/bin | grep -i -E 'sim|duo|pose|hub' 
          echo ---- pose strings in CoreSimulator
          strings "$(xcode-select -p)/../SharedFrameworks/CoreSimulator.framework/CoreSimulator" 2>/dev/null | grep -i -E 'posture|foldpose|hingeangle|duopose' | sort -u | head -30
          xcodebuild -list -project ios/Playscribe.xcodeproj 2>&1 | head -3 || true
