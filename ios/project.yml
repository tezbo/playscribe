name: Playscribe
options:
  bundleIdPrefix: co.codeconnectors
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # One setting drives the app and widget bundle IDs and the App Group. The release lane overrides it.
    PLAYSCRIBE_BUNDLE_ID: co.codeconnectors.playscribe
targets:
  Playscribe:
    type: application
    platform: iOS
    sources:
      - path: Playscribe
      - path: Shared
    dependencies:
      - target: PlayscribeWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYSCRIBE_BUNDLE_ID)
        INFOPLIST_FILE: Playscribe/Info.plist
        CODE_SIGN_ENTITLEMENTS: Playscribe/Playscribe.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG INTERNAL
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: INTERNAL
  PlayscribeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PlayscribeWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: Playscribe/Resources/Fonts
        includes: ["InstrumentSans-*.ttf"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYSCRIBE_BUNDLE_ID).widget
        INFOPLIST_FILE: PlayscribeWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PlayscribeWidget/PlayscribeWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES
  PlayscribeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlayscribeTests
    dependencies:
      - target: Playscribe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PlayscribeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlayscribeUITests
    dependencies:
      - target: Playscribe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Playscribe
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Playscribe:
    build:
      targets:
        Playscribe: all
    test:
      targets:
        - PlayscribeTests
  PlayscribeUI:
    build:
      targets:
        Playscribe: all
        PlayscribeUITests: [test]
    test:
      targets:
        - PlayscribeUITests
