name: Playscribe
options:
  bundleIdPrefix: co.codeconnectors
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
targets:
  Playscribe:
    type: application
    platform: iOS
    sources:
      - path: Playscribe
    postBuildScripts:
      - name: Stamp git SHA
        basedOnDependencyAnalysis: false
        script: |
          sha=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo dev)
          /usr/libexec/PlistBuddy -c "Set :PlayscribeGitSHA $sha" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.codeconnectors.playscribe
        INFOPLIST_FILE: Playscribe/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG INTERNAL
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: INTERNAL
  PlayscribeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlayscribeTests
    dependencies:
      - target: Playscribe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PlayscribeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlayscribeUITests
    dependencies:
      - target: Playscribe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Playscribe
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Playscribe:
    build:
      targets:
        Playscribe: all
    test:
      targets:
        - PlayscribeTests
  PlayscribeUI:
    build:
      targets:
        Playscribe: all
        PlayscribeUITests: [test]
    test:
      targets:
        - PlayscribeUITests
